apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-agent
  labels:
    app: voice-agent
    {{- include "fv.labels" . | nindent 4 }}
spec:
  replicas: 1                          # one ARI app instance owns the Stasis app today
  selector: {matchLabels: {app: voice-agent}}
  template:
    metadata:
      labels: {app: voice-agent}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9464"}
    spec:
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # hostPath dirs are created root-owned; hand this one to the agent's uid (10001) so it
        # can write transfer briefings. The only step that runs as root, with just CAP_CHOWN.
        - name: own-dynamic-sounds
          image: {{ include "fv.image" (dict "root" . "name" "voice-agent") }}
          command: [chown, "10001:10001", /srv/dynamic-sounds]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [CHOWN]}
          volumeMounts: [{name: dynamic-sounds, mountPath: /srv/dynamic-sounds}]
      containers:
        - name: agent
          image: {{ include "fv.image" (dict "root" . "name" "voice-agent") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - name: HOST_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - name: AGENT_MEDIA_HOST          # Asterisk (hostNetwork) sends RTP straight to the pod IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: ARI_URL, value: "http://$(HOST_IP):8088"}
            - {name: TTS_URL, value: "http://freya-tts:8080"}
            - {name: STT_BACKEND, value: http}
            - {name: STT_MODEL, value: "http://whisper-stt:8081"}
            - {name: OLLAMA_URL, value: {{ .Values.agent.llm.url | quote }}}
            - {name: LLM_MODEL, value: {{ .Values.agent.llm.model | quote }}}
            - {name: ROUTER, value: {{ .Values.agent.llm.router | quote }}}
            - {name: HUMAN_AGENT_ENDPOINT, value: {{ .Values.agent.humanAgentEndpoint | quote }}}
            - {name: DYNAMIC_SOUNDS_DIR, value: /srv/dynamic-sounds}
          envFrom: [{secretRef: {name: {{ .Values.existingSecret }}}}]
          ports:
            - {name: console, containerPort: 8090}
            - {name: metrics, containerPort: 9464}
          volumeMounts:
            - {name: dynamic-sounds, mountPath: /srv/dynamic-sounds}
            - {name: console-audio, mountPath: /tmp/console-audio}
          resources: {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: dynamic-sounds
          hostPath: {path: {{ .Values.dynamicSoundsHostPath }}, type: DirectoryOrCreate}
        - name: console-audio
          emptyDir: {sizeLimit: 500Mi}
---
apiVersion: v1
kind: Service
metadata: {name: voice-agent, labels: {app: voice-agent}}
spec:
  selector: {app: voice-agent}
  ports:
    - {name: console, port: 8090, targetPort: console}
    - {name: metrics, port: 9464, targetPort: metrics}
