# In-cluster OCI registry: the only place the cluster pulls images from.
# hostNetwork so containerd on the node reaches it on 127.0.0.1:5000 (see registries.yaml).
apiVersion: v1
kind: Namespace
metadata: {name: registry}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: registry-data, namespace: registry}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 40Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: registry, namespace: registry}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      hostNetwork: true
      containers:
        - name: registry
          image: registry:2
          env:
            - {name: REGISTRY_HTTP_ADDR, value: "127.0.0.1:5000"}   # node-local only
          volumeMounts: [{name: data, mountPath: /var/lib/registry}]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: registry-data}}
