[general]
static = yes
writeprotect = yes

[globals]

; ---------------------------------------------------------------------------
; Calls placed by registered phones
; ---------------------------------------------------------------------------
[from-internal]
exten => 100,1,NoOp(Inbound call to the bank line from ${CALLERID(all)})
 same => n,Goto(bank-ivr,s,1)

exten => _100X,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Phase 1: static IVR voiced by FreyaTTS (prompts pre-rendered to 8 kHz).
; Phase 2 replaces this with a real-time STT -> LLM -> TTS agent over ARI.
; ---------------------------------------------------------------------------
[bank-ivr]
exten => s,1,Answer()
 same => n,Set(CHANNEL(language)=tr)
 same => n,Set(TIMEOUT(digit)=4)
 same => n,Set(TIMEOUT(response)=6)
 same => n,Wait(0.5)
 same => n,Playback(freya/welcome)
 same => n(menu),Background(freya/menu)
 same => n,WaitExten()

; 1 - card statement
exten => 1,1,Playback(freya/card-info)
 same => n,Goto(s,menu)

; 2 - lost / stolen card
exten => 2,1,Playback(freya/lost-card)
 same => n,Goto(s,menu)

; 0 - hand over to a human agent
exten => 0,1,Playback(freya/transfer)
 same => n,Dial(PJSIP/1002,30)
 same => n,Playback(freya/agent-busy)
 same => n,Goto(s,menu)

exten => i,1,Playback(freya/invalid)
 same => n,Goto(s,menu)

exten => t,1,Playback(freya/goodbye)
 same => n,Hangup()
