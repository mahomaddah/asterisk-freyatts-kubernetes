; ---------------------------------------------------------------------------
; SIP transport. Asterisk runs behind NAT (Docker now, a Kubernetes Service later),
; so SIP and SDP must advertise the address phones actually reach.
; ---------------------------------------------------------------------------
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_media_address = ${EXTERNAL_IP}
external_signaling_address = ${EXTERNAL_IP}
local_net = 172.16.0.0/12
local_net = 127.0.0.0/8

; ---------------------------------------------------------------------------
; Shared endpoint settings
; ---------------------------------------------------------------------------
[endpoint-defaults](!)
type = endpoint
context = from-internal
disallow = all
allow = ulaw,alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
language = tr

[aor-defaults](!)
type = aor
max_contacts = 2
remove_existing = yes
qualify_frequency = 30

[auth-defaults](!)
type = auth
auth_type = userpass

; 1001 = "customer" softphone
[1001](endpoint-defaults)
auth = 1001
aors = 1001
callerid = "Customer" <1001>
[1001](auth-defaults)
username = 1001
password = ${SIP_PASSWORD_1001}
[1001](aor-defaults)

; 1002 = "human agent" softphone (target of transfers)
[1002](endpoint-defaults)
auth = 1002
aors = 1002
callerid = "Agent" <1002>
[1002](auth-defaults)
username = 1002
password = ${SIP_PASSWORD_1002}
[1002](aor-defaults)
